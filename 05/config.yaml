# 模型参数组
model_parameters:
  # 原始Onnx浮点模型文件
  onnx_model: 'best.onnx'

  # 转换的目标处理器架构
  march: 'bayes-e'

  # 模型转换输出的用于上板执行的模型文件的名称前缀
  output_model_file_prefix: 'model'

  # 模型转换输出的结果的存放目录
  working_dir: 'output'

    # 将Softmax指定到BPU运行
  node_info: {
    "/model.10/m/m.0/attn/Softmax": {
      'ON': 'BPU',
      'InputType': 'int16',
      'OutputType': 'int16'
    }
  }


# 输入信息参数组
input_parameters:
  # 原始浮点模型的输入节点名称
  input_name: "images"

  # 原始浮点模型的输入数据格式（数量/顺序与input_name一致）
  input_type_train: 'rgb'

  # 原始浮点模型的输入数据排布（数量/顺序与input_name一致）
  input_layout_train: 'NCHW'

  # 原始浮点模型的输入数据尺寸
  input_shape: '1x3x384x640'

  # 量化模型包装的预处理方法：缩放
  norm_type: 'data_scale'

  # 缩放比例=1/255
  scale_value: '0.00392156862745098' 

  # 转换后混合异构模型需要适配的输入数据格式
  input_type_rt: 'nv12'


# 校准参数组
calibration_parameters:
  # 模型校准使用的标定样本的存放目录
  cal_data_dir: 'cal_raw'

  # 指定校准数据二进制文件的数据存储类型。
  cal_data_type: 'float32'

  # 校准使用的算法类型'default'、'mix'、'kl'、'max' 、 'load' 和 'skip'
  calibration_type: 'default'


# 编译参数组
compiler_parameters:
  # 编译策略选择
  compile_mode: 'latency'

  # 是否打开编译的debug信息
  debug: True

  # 模型运行核心数
  core_num: 1

  # 模型编译的优化等级选择
  optimize_level: 'O3'
  

